# Render Blueprint: one web service (API + web app, built from the Dockerfile) and a Postgres database.
# Deploy with: Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: fitai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FITAI_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitai-db
          property: connectionString
      # Optional: a free api.data.gov key enables USDA food search. Leave blank to skip.
      - key: FITAI_USDA_API_KEY
        sync: false

databases:
  - name: fitai-db
    plan: free
    databaseName: fitai
    user: fitai
