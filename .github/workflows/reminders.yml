name: Reminders

# Wakes the app every 15 minutes so it can send any reminders that are due.
# Needs repository secrets FITAI_APP_URL and FITAI_CRON_SECRET (see README → Reminders).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    name: Send due reminders
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the reminders endpoint
        env:
          APP_URL: ${{ secrets.FITAI_APP_URL }}
          CRON_SECRET: ${{ secrets.FITAI_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "FITAI_APP_URL or FITAI_CRON_SECRET is not set; skipping."
            exit 0
          fi
          # Retries give a sleeping free-tier server time to wake up.
          curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 \
            -X POST -H "X-Cron-Secret: $CRON_SECRET" "${APP_URL%/}/api/internal/reminders/run"
